name: profile-3d

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.9.3
        env:
          # PROFILE_TOKEN (read:user) adds private contribution counts; falls back to public only
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A profile-3d-contrib
          git diff --staged --quiet || (git commit -m "-" && git push)
